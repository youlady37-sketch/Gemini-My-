name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Package extension
        run: |
          cd dist
          zip -r ../hh-reply-ai-extension.zip .
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: hh-reply-ai-extension
          path: hh-reply-ai-extension.zip
          if-no-files-found: error
